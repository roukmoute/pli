[package]
name = "pli-acceptance"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
hex = "0.4.3"
humantime = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt", "time"] }
webmail-server = { path = ".." }

[dev-dependencies]
axum = "0.8.9"
