[workspace]
members = ["acceptance"]

[package]
name = "webmail-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
include_dir = "0.7.4"
mail-send = { version = "0.7.0", default-features = false, features = ["ring", "tls12"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "~2.6.0", features = ["from-directory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smtp-proto = "0.2.5"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
