[workspace]
members = ["acceptance"]

[package]
name = "webmail-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
axum = "0.8.9"
include_dir = "0.7.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "~2.6.0", features = ["from-directory"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
